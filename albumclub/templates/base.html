<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Album Club{% endblock %} · Album Club</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">♫ Album Club</a>
    <nav>
      {% if g.user %}
        <span class="muted">{{ g.user['username'] }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <button type="submit" class="link">Log out</button>
        </form>
      {% endif %}
    </nav>
  </header>

  <main id="main" tabindex="-1">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
