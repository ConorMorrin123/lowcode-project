{% extends "base.html" %}
{% block title %}Propose an album{% endblock %}
{% block content %}
<h1>Propose an album</h1>
<p class="muted">For <a href="{{ url_for('club_view', club_id=club['ClubID']) }}">{{ club['Name'] }}</a></p>
<form method="post" class="card stack">
  <label>Title
    <input type="text" name="title" required value="{{ form.get('title', '') }}">
  </label>
  <label>Artist
    <input type="text" name="artist" required value="{{ form.get('artist', '') }}">
  </label>
  <label>Release year
    <input type="number" name="year" min="1900" max="2100" required value="{{ form.get('year', '') }}">
  </label>
  <label>Genre
    <input type="text" name="genre" required value="{{ form.get('genre', '') }}">
  </label>
  <label>Why should the club listen? (optional, max 200 characters)
    <textarea name="pitch" maxlength="200" rows="3">{{ form.get('pitch', '') }}</textarea>
  </label>
  <button type="submit">Submit proposal</button>
</form>
{% endblock %}
