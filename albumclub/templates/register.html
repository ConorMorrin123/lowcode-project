{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" class="card stack">
  <label>Username
    <input type="text" name="username" maxlength="50" required value="{{ form.get('username', '') }}">
  </label>
  <label>Email
    <input type="email" name="email" required value="{{ form.get('email', '') }}">
  </label>
  <label>Password (at least 8 characters)
    <input type="password" name="password" minlength="8" required>
  </label>
  <label>Your music taste (optional)
    <input type="text" name="music_taste" maxlength="200" value="{{ form.get('music_taste', '') }}">
  </label>
  <button type="submit">Create account</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
{% endblock %}
