{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Log in</h1>
    <form method="post" action="{{ url_for('login') }}" class="form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required value="{{ form.get('email', '') }}" autocomplete="email">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">

      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="muted small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
{% endblock %}
