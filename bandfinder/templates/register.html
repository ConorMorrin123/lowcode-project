{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Create your account</h1>
    <form method="post" action="{{ url_for('register') }}" class="form">
      <label for="username">Username <span class="muted small">(3–30 characters, shown on your profile)</span></label>
      <input id="username" name="username" required minlength="3" maxlength="30" value="{{ form.get('username', '') }}" autocomplete="username">

      <label for="email">Email <span class="muted small">(never shown to other users)</span></label>
      <input id="email" name="email" type="email" required value="{{ form.get('email', '') }}" autocomplete="email">

      <label for="password">Password <span class="muted small">(at least 8 characters)</span></label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">

      <label class="check"><input type="checkbox" name="confirmed_adult" value="yes" required
        {% if form.get('confirmed_adult') %}checked{% endif %}> I am 18 or over</label>

      <button type="submit" class="btn">Sign up</button>
    </form>
    <p class="muted small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </section>
{% endblock %}
