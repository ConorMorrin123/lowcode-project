<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], textarea {
      width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    textarea { height: 120px; }
    .error { color: #d9534f; font-size: 0.875rem; margin-top: 5px; }
    .input-error { border-color: #d9534f !important; }
    button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <h2>Contact Us</h2>
  <form action="/contact" method="POST" novalidate>
    <!-- Name Field -->
    <div class="form-group">
      <label for="name">Name:</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        value="{{ form_data.get('name', '') }}"
        class="{{ 'input-error' if errors.name else '' }}"
      >
      {% if errors.name %}
        <div class="error">{{ errors.name }}</div>
      {% endif %}
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="text" 
        id="email" 
        name="email" 
        value="{{ form_data.get('email', '') }}"
        class="{{ 'input-error' if errors.email else '' }}"
      >
      {% if errors.email %}
        <div class="error">{{ errors.email }}</div>
      {% endif %}
    </div>

    <!-- Message Field -->
    <div class="form-group">
      <label for="message">Message:</label>
      <textarea 
        id="message" 
        name="message" 
        class="{{ 'input-error' if errors.message else '' }}"
      >{{ form_data.get('message', '') }}</textarea>
      {% if errors.message %}
        <div class="error">{{ errors.message }}</div>
      {% endif %}
    </div>

    <button type="submit">Send Message</button>
  </form>
</body>
</html>
